name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Check hook scripts syntax
        run: bash -n hooks/notify.sh hooks/statusline_tee.sh
      - name: Render a frame offline (no model calls)
        env:
          PAGER_STATE: ${{ runner.temp }}/state.json
        run: uv run python -c "from pager.render import render; from pager.state import State; render(State()).save('${{ runner.temp }}/frame.bmp')"
